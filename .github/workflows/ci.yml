# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      # The real CLI on real repositories at fixed commits, compared with e2e/expected.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The demo as tests (spec/analysis.md#demo-tests): the real terminal and web view in Google Chrome, on the
  # demo's stage; a video of every test, every run, kept as the run's `demo-tests` artifact.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Google Chrome is on the runner already.
      - name: ttyd and ffmpeg
        run: |
          sudo curl -fsSL -o /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd
          npx playwright install ffmpeg
      - run: npm run test:demo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-tests
          path: |
            test-results/
            playwright-report/
