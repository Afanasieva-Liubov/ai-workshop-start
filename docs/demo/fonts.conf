<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The only fonts Chrome sees in the demo and its tests: DejaVu, from the dejavu-fonts-ttf package
     that npm ci installs at a fixed version. The same letters on every machine, whatever it has installed. -->
<fontconfig>
  <dir prefix="relative">../../node_modules/dejavu-fonts-ttf/ttf</dir>
  <cachedir prefix="xdg">skill-atlas-demo-fonts</cachedir>
  <!-- Not for text: never picked for a page, even as a fallback. -->
  <selectfont><rejectfont><glob>*/DejaVuMathTeXGyre.ttf</glob><glob>*/DejaVuSans-ExtraLight.ttf</glob></rejectfont></selectfont>
  <alias binding="same"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>ui-monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
